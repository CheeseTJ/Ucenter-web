<title>用户中心 · 身份登记处</title>
<script>
  // 管理台没有做移动端适配，手机上打开只会看到一个用不了的界面。
  // 手机浏览器一律送去 H5：注册 / 登录 / 我的账号都在那边。
  // 用无扩展名的 h5：Cloudflare Pages 会把 /h5.html 308 跳到 /h5。
  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
    location.replace("h5" + location.hash);
  }
</script>
